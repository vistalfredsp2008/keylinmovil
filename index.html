<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Papelería Keylin - Móvil</title>
    
    <!-- Estilos Web / Mobile UI -->
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #28a745;
            --accent-blue: #007bff;
            --text: #ffffff;
            --text-muted: #aaa;
            --danger: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Tarjetas e Inputs */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
        }

        button.btn-blue { background-color: var(--accent-blue); }
        button.btn-danger { background-color: var(--danger); }

        /* Pantalla de Lector / Consulta */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
        }

        .precio-grande {
            font-size: 2.5rem;
            color: var(--accent);
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        /* Lista de Carrito */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        /* Barra de Navegación Inferior */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #1f1f1f;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #333;
        }

        nav div {
            padding: 12px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex: 1;
        }

        nav div.active {
            color: var(--accent-blue);
            font-weight: bold;
        }

        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 400px;
        }
    </style>

    <!-- Librería HTML5 QR / Barcode Scanner NAtivo -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <header>Papelería Keylin — Punto Móvil</header>

    <main>
        <!-- PESTAÑA 1: CONSULTAR Y ESCANEAR -->
        <div id="tab-consultar" class="tab-content active">
            <button onclick="iniciarCamara()" class="btn-blue">📷 Activar Cámara / Escáner</button>
            <button onclick="detenerCamara()" class="btn-danger" id="btn-stop-cam" style="display:none; margin-top:5px;">⏹️ Apagar Cámara</button>
            
            <div id="reader" style="margin-top: 10px;"></div>

            <input type="text" id="input-codigo" placeholder="O escriba el código / nombre..." onkeyup="buscarManual(event)">

            <div class="card" id="card-resultado" style="text-align: center;">
                <div id="res-nombre" style="font-size: 1.2rem; font-weight: bold;">Escanee un producto</div>
                <div id="res-precio" class="precio-grande">$0.00</div>
                <div id="res-cat" style="color: var(--text-muted);">Categoría: ---</div>
                <button id="btn-add-cart" onclick="agregarDelBuscadorAlCarrito()" style="display:none; margin-top:15px;">🛒 Agregar al Carrito</button>
            </div>
        </div>

        <!-- PESTAÑA 2: VENDER (CARRITO) -->
        <div id="tab-vender" class="tab-content">
            <button onclick="abrirModalComun()" class="btn-blue">➕ Producto Común / Servicio</button>
            
            <div class="card" style="margin-top: 15px;">
                <h3>Carrito de Venta</h3>
                <div id="lista-carrito">
                    <p style="color: var(--text-muted); text-align: center;">Carrito vacío</p>
                </div>
                <hr style="border-color: #333;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 1.2rem; font-weight: bold;">TOTAL:</span>
                    <span id="lbl-total-carrito" class="precio-grande" style="margin: 0;">$0.00</span>
                </div>
                <button onclick="abrirModalCobro()" style="margin-top: 15px;">✔ Cobrar Venta</button>
            </div>
        </div>

        <!-- PESTAÑA 3: CATÁLOGO -->
        <div id="tab-catalogo" class="tab-content">
            <input type="text" id="filtro-catalogo" placeholder="Filtrar catálogo..." onkeyup="filtrarCatalogoUI()">
            <div id="lista-catalogo"></div>
        </div>
    </main>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav>
        <div class="active" onclick="cambiarPestana('consultar', this)">🔍 Consultar</div>
        <div onclick="cambiarPestana('vender', this)">🛒 Vender</div>
        <div onclick="cambiarPestana('catalogo', this)">📦 Catálogo</div>
    </nav>

    <!-- MODAL PRODUCTO COMÚN -->
    <div id="modal-comun" class="modal">
        <div class="modal-content">
            <h3>➕ Producto Común</h3>
            <input type="text" id="comun-nombre" placeholder="Nombre (ej. Copia, Engargolado)">
            <input type="number" id="comun-precio" placeholder="Precio ($)">
            <input type="number" id="comun-cant" value="1" placeholder="Cantidad">
            <button onclick="guardarProductoComun()">Agregar al Carrito</button>
            <button onclick="cerrarModales()" class="btn-danger" style="margin-top: 5px;">Cancelar</button>
        </div>
    </div>

    <!-- MODAL COBRO -->
    <div id="modal-cobro" class="modal">
        <div class="modal-content">
            <h3>Cobro de Venta</h3>
            <div style="font-size: 1.2rem; text-align: center;">Total a Pagar:</div>
            <div id="cobro-total-txt" class="precio-grande">$0.00</div>
            <input type="number" id="cobro-paga" placeholder="Con cuánto paga ($)" onkeyup="calcularCambioUI()">
            <div style="text-align: center; margin: 10px 0;">
                <div>CAMBIO:</div>
                <div id="cobro-cambio-txt" style="font-size: 2rem; color: var(--accent-blue); font-weight: bold;">$0.00</div>
            </div>
            <button onclick="confirmarVentaFirebase()">✔ Confirmar y Guardar</button>
            <button onclick="cerrarModales()" class="btn-danger" style="margin-top: 5px;">Cancelar</button>
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT & FIREBASE -->
    <script>
        const URL_FIREBASE = "https://catalogo-precios-5ff25-default-rtdb.firebaseio.com";
        let productosCache = {};
        let carrito = [];
        let html5QrcodeScanner = null;
        let productoSeleccionadoActual = null;

        // Cargar Catálogo al Abrir
        window.onload = () => {
            cargarProductosFirebase();
        };

        function cargarProductosFirebase() {
            fetch(`${URL_FIREBASE}/productos.json`)
                .then(res => res.json())
                .then(data => {
                    productosCache = data || {};
                    renderizarCatalogo();
                })
                .catch(err => console.error("Error Firebase:", err));
        }

        // Navegación de Pestañas
        function cambiarPestana(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav div').forEach(n => n.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            el.classList.add('active');
            if (tabName !== 'consultar') detenerCamara();
        }

        // Cámara / Escáner
        function iniciarCamara() {
            document.getElementById('btn-stop-cam').style.display = 'block';
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    document.getElementById('input-codigo').value = decodedText;
                    buscarProducto(decodedText);
                    detenerCamara();
                }
            ).catch(err => alert("Error al abrir cámara: " + err));
        }

        function detenerCamara() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    document.getElementById('btn-stop-cam').style.display = 'none';
                }).catch(() => {});
            }
        }

        // Búsqueda de Productos
        function buscarManual(e) {
            if (e.key === 'Enter' || e.target.value.length >= 3) {
                buscarProducto(e.target.value.trim());
            }
        }

        function buscarProducto(codigo) {
            if (productosCache[codigo]) {
                let p = productosCache[codigo];
                productoSeleccionadoActual = { codigo: codigo, ...p };
                document.getElementById('res-nombre').innerText = p.nombre;
                document.getElementById('res-precio').innerText = `$${parseFloat(p.precio).toFixed(2)}`;
                document.getElementById('res-cat').innerText = `Categoría: ${p.categoria || 'General'}`;
                document.getElementById('btn-add-cart').style.display = 'block';
            } else {
                document.getElementById('res-nombre').innerText = "❌ No Encontrado";
                document.getElementById('res-precio').innerText = "$0.00";
                document.getElementById('res-cat').innerText = `Código: ${codigo}`;
                document.getElementById('btn-add-cart').style.display = 'none';
            }
        }

        // Lógica del Carrito
        function agregarDelBuscadorAlCarrito() {
            if (productoSeleccionadoActual) {
                agregarAlCarrito(productoSeleccionadoActual.codigo, productoSeleccionadoActual.nombre, productoSeleccionadoActual.precio);
                alert(`🛒 Agregado: ${productoSeleccionadoActual.nombre}`);
            }
        }

        function agregarAlCarrito(codigo, nombre, precio) {
            let item = carrito.find(i => i.codigo === codigo && codigo !== "0");
            if (item) {
                item.cantidad++;
                item.subtotal = item.cantidad * item.costo;
            } else {
                carrito.push({
                    codigo: String(codigo),
                    nombre: nombre,
                    costo: parseFloat(precio),
                    cantidad: 1,
                    descuento: 0,
                    subtotal: parseFloat(precio)
                });
            }
            renderizarCarrito();
        }

        function renderizarCarrito() {
            let container = document.getElementById('lista-carrito');
            let total = 0;
            container.innerHTML = "";

            if (carrito.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Carrito vacío</p>`;
            } else {
                carrito.forEach((item, index) => {
                    total += item.subtotal;
                    container.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <strong>${item.cantidad}x ${item.nombre}</strong><br>
                                <small style="color:#aaa">$${item.costo.toFixed(2)} c/u</small>
                            </div>
                            <div>
                                <strong>$${item.subtotal.toFixed(2)}</strong>
                                <button onclick="eliminarDelCarrito(${index})" class="btn-danger" style="width:auto; padding: 5px 10px; margin-left:10px;">X</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('lbl-total-carrito').innerText = `$${total.toFixed(2)}`;
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            renderizarCarrito();
        }

        // Modales
        function abrirModalComun() { document.getElementById('modal-comun').style.display = 'flex'; }
        function abrirModalCobro() {
            if (carrito.length === 0) return alert("El carrito está vacío");
            let total = carrito.reduce((sum, i) => sum + i.subtotal, 0);
            document.getElementById('cobro-total-txt').innerText = `$${total.toFixed(2)}`;
            document.getElementById('modal-cobro').style.display = 'flex';
        }
        function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        function guardarProductoComun() {
            let nom = document.getElementById('comun-nombre').value;
            let pre = document.getElementById('comun-precio').value;
            let cant = document.getElementById('comun-cant').value || 1;

            if (nom && pre) {
                carrito.push({
                    codigo: "0",
                    nombre: nom,
                    costo: parseFloat(pre),
                    cantidad: parseInt(cant),
                    descuento: 0,
                    subtotal: parseFloat(pre) * parseInt(cant)
                });
                renderizarCarrito();
                cerrarModales();
                document.getElementById('comun-nombre').value = "";
                document.getElementById('comun-precio').value = "";
            }
        }

        function calcularCambioUI() {
            let total = carrito.reduce((sum, i) => sum + i.subtotal, 0);
            let paga = parseFloat(document.getElementById('cobro-paga').value) || total;
            let cambio = paga - total;
            document.getElementById('cobro-cambio-txt').innerText = cambio >= 0 ? `$${cambio.toFixed(2)}` : 'Faltante';
        }

        // Guardar Venta en Firebase
        function confirmarVentaFirebase() {
            let total = carrito.reduce((sum, i) => sum + i.subtotal, 0);
            let paga = parseFloat(document.getElementById('cobro-paga').value) || total;
            if (paga < total) return alert("El monto pagado es menor al total");

            let ticket = {
                fecha: new Date().toISOString().replace('T', ' ').substring(0, 19),
                total: total,
                pagado: paga,
                cambio: paga - total,
                detalles: carrito
            };

            fetch(`${URL_FIREBASE}/ventas_moviles_pendientes.json`, {
                method: 'POST',
                body: JSON.stringify(ticket)
            })
            .then(res => {
                if (res.ok) {
                    alert(`✔ Venta realizada. Cambio: $${ticket.cambio.toFixed(2)}`);
                    carrito = [];
                    renderizarCarrito();
                    cerrarModales();
                }
            })
            .catch(err => alert("Error de red al guardar venta"));
        }

        // Renderizado del Catálogo
        function renderizarCatalogo() {
            let container = document.getElementById('lista-catalogo');
            container.innerHTML = "";
            Object.keys(productosCache).forEach(cod => {
                let p = productosCache[cod];
                container.innerHTML += `
                    <div class="card" onclick="agregarAlCarrito('${cod}', '${p.nombre}', ${p.precio}); alert('Agregado!')">
                        <strong>${p.nombre}</strong>
                        <div style="display:flex; justify-content:space-between; margin-top:5px;">
                            <small style="color:#aaa">Cód: ${cod}</small>
                            <span style="color:var(--accent); font-weight:bold;">$${parseFloat(p.precio).toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
